name: Simple APK Builder

on:
  push:
    branches: [ "main" ]

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Direct APK Package
        run: |
          echo "Inatengeneza muundo wa APK..."
          mkdir -p output_app
          # Hapa tunatengeneza mfuko maalum wa APK kwa ajili ya majaribio
          cd app && zip -r ../output_app/OmniSystem-Debug.apk .
          echo "Imefanikiwa kukamilika!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: output_app/OmniSystem-Debug.apk
